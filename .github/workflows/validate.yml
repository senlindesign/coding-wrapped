name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate repository and Skill
        run: python3 scripts/validate_release.py
      - name: Package Skill
        run: python3 scripts/package_skill.py
      - uses: actions/upload-artifact@v6
        with:
          name: coding-wrapped-skill
          path: dist/coding-wrapped.skill
